[project]
name = "hackable-engine"
description = ""
version = "0.1.0"
authors = [
    { name = "Arek Kulczycki" },
    {name = "arekkulczycki", email = "ten.arek@gmail.com"},
]
dependencies = [
    "chess==1.11.*",
#    "nptyping==2.5.*",
    "anytree==2.12.*",
    "astar==0.99",
    "intel-extension-for-pytorch==2.6.10+xpu",
    "oneccl_bind_pt==2.6.0+xpu",
    "torch==2.6.0+xpu",
    "torchaudio==2.6.0+xpu",
    "torchvision==0.21.0+xpu",
    "gymnasium==1.1.*",
    "matplotlib==3.10.*",
#    "stable-baselines3>=2.5.0",
    "tensorboard==2.19.*",
    "torch-geometric==2.6.*",
    "faster-fifo==1.5.2",
    "janus==2.0.*",
]
requires-python = "==3.12.8"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "ipython>=8.32.0",
    "pip>=25.0.1",
    "memray>=1.16.0",
    "pympler>=1.1",
]

[options]
package_dir = "hackable_engine"

[tool.setuptools]
packages = [
    "hackable_engine.board",
    "hackable_engine.board.chess",
    "hackable_engine.board.chess.mixins",
    "hackable_engine.board.hex",
    "hackable_engine.board.hex.mixins",
    "hackable_engine.common",
    "hackable_engine.common.memory",
    "hackable_engine.common.memory.adapters",
    "hackable_engine.common.queue",
    "hackable_engine.common.queue.adapters",
    "hackable_engine.common.queue.items",
    "hackable_engine.criteria",
    "hackable_engine.criteria.evaluation",
    "hackable_engine.criteria.evaluation.chess",
    "hackable_engine.criteria.evaluation.hex",
    "hackable_engine.criteria.selection",
    "hackable_engine.game_tree",
    "hackable_engine.workers",
]

#[tool.pdm]
#distribution = false
#[tool.pdm.resolution.overrides]
#torch = "2.5.1+cxx11.abi"

#[[tool.pdm.source]]
#name = "pytorch"
#url = "https://download.pytorch.org/whl/xpu"
#verify_ssl = true
#
#[[tool.pdm.source]]
#name = "intel"
#url = "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/"
#verify_ssl = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
#default = true

[[tool.uv.index]]
name = "intel"
url = "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/"
explicit = true
#default = true

#[[tool.uv.index]]
#name = "pypi"
#url = "https://pypi.org/"
#default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
intel-extension-for-pytorch = { index = "intel" }
oneccl_bind_pt = { index = "intel" }
#intel-opencl-rt = { index = "intel" }
