[project]
name = "hackable-engine"
description = ""
version = "0.1.0"
authors = [
    { name = "Arek Kulczycki" },
    {name = "arekkulczycki", email = "ten.arek@gmail.com"},
]
dependencies = [
    "chess==1.11.*",
    "anytree==2.12.*",
    "astar==0.99",
    "numpy==2.2.5", # current version in pyodide
    "faster-fifo==1.5.2",
    ### TRAINING ###
    "aiofiles==24.1.*",
    "janus==2.0.*",
    "pytorch-triton-xpu==3.5",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision",
    "gymnasium==1.2.*",
    "matplotlib==3.10.*",
    "tensorboard==2.20.*",
    "torch-geometric==2.7.*",
    "onnx==1.20.*",
    "onnxruntime==1.23.*",
    "onnxscript==0.5.7",
    ### TESTING ###
    "black>=25",
    "ipython>=8",
    "memray>=1",
    "mypy>=1",
    "perflint>=0",
    "pip>=25",
    "pyinstrument>=5",
    "pympler>=1",
    "pyright>=1",
    "ruff>=0",
    "cachetools>=6.2.1",
]
requires-python = "==3.13.3"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
training = [
    "aiofiles==24.1.*",
    "janus==2.0.*",
    "pytorch-triton-xpu==3.5",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision",
    "gymnasium==1.2.*",
    "matplotlib==3.10.*",
    "tensorboard==2.20.*",
    "torch-geometric==2.7.*",
    "onnx==1.20.*",
    "onnxruntime==1.23.*"
]
testing = [
    "black>=25",
    "ipython>=8",
    "memray>=1",
    "mypy>=1",
    "perflint>=0",
    "pip>=25",
    "pyinstrument>=5",
    "pympler>=1",
    "pyright>=1",
    "ruff>=0",
]

[options]
package_dir = "hackable_engine"

[tool.setuptools]
packages = [
    "hackable_engine.board",
#    "hackable_engine.board.chess",
#    "hackable_engine.board.chess.mixins",
    "hackable_engine.board.hex",
    "hackable_engine.board.hex.serializers",
    "hackable_engine.common",
    "hackable_engine.common.memory",
    "hackable_engine.common.memory.adapters",
    "hackable_engine.common.queue",
    "hackable_engine.common.queue.adapters",
    "hackable_engine.common.queue.items",
    "hackable_engine.criteria",
    "hackable_engine.criteria.evaluation",
#    "hackable_engine.criteria.evaluation.chess",
    "hackable_engine.criteria.evaluation.hex",
    "hackable_engine.criteria.selection",
    "hackable_engine.game_tree",
    "hackable_engine.workers",
    "hackable_engine.workers.configs",
]

#[tool.pdm]
#distribution = false
#[tool.pdm.resolution.overrides]
#torch = "2.5.1+cxx11.abi"

#[[tool.pdm.source]]
#name = "pytorch"
#url = "https://download.pytorch.org/whl/xpu"
#verify_ssl = true
#
#[[tool.pdm.source]]
#name = "intel"
#url = "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/"
#verify_ssl = true

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "intel"
url = "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/"
explicit = true
#default = true

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/xpu"
#url = "https://download.pytorch.org/whl/cu128"
explicit = true
#default = true

#[[tool.uv.index]]
#name = "pypi"
#url = "https://pypi.org/"
#default = true

[tool.uv.sources]
torch = { index = "torch" }
torchvision = { index = "torch" }
torchaudio = { index = "torch" }
pytorch-triton-xpu = { index = "torch" }

[tool.black]
line-length = 120
